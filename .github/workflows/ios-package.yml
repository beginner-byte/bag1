name: Package iOS Ad Hoc IPA

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: App version in major.minor.patch format, for example 1.0.0
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: Positive integer build number used by iOS
        required: true
        default: "100"
        type: string

permissions:
  contents: read

concurrency:
  group: ios-ad-hoc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-ios:
    name: Build signed Ad Hoc IPA
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      # Matches the Flutter revision recorded by the current project metadata.
      FLUTTER_VERSION: "3.44.4"
      # Identifies the only iOS application target covered by the supplied profile.
      BUNDLE_ID: com.hnttscl.worker
      # Comes from both the supplied P12 identity and mobile provisioning profile.
      SIGNING_TEAM_ID: 2QHC3YY7M3
      # Selects the manually managed Ad Hoc provisioning profile during archive and export.
      PROFILE_NAME: here
      # Keeps workflow inputs out of shell source so their values cannot become commands.
      VERSION_NUMBER: ${{ inputs.version_number }}
      # Overrides CFBundleVersion without modifying pubspec.yaml.
      BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate version inputs
        run: |
          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_number must use major.minor.patch format."
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build_number must be a positive integer."
            exit 1
          fi

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Import signing certificate and profile
        env:
          # Base64-encoded contents of app/证书/here.p12, stored only in GitHub Secrets.
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          # Import password for the supplied P12, stored only in GitHub Secrets.
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          # Base64-encoded contents of app/证书/here.mobileprovision, stored only in GitHub Secrets.
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          if [[ -z "$IOS_P12_BASE64" || -z "$IOS_P12_PASSWORD" || -z "$IOS_MOBILEPROVISION_BASE64" ]]; then
            echo "::error::IOS_P12_BASE64, IOS_P12_PASSWORD, and IOS_MOBILEPROVISION_BASE64 are required."
            exit 1
          fi

          # All restored signing assets stay inside the runner's temporary directory.
          P12_PATH="$RUNNER_TEMP/ios-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/ios-ad-hoc.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/ios-ad-hoc.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # A per-run random password protects the disposable keychain while the job is active.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$IOS_P12_BASE64" | base64 -D > "$P12_PATH"
          printf '%s' "$IOS_MOBILEPROVISION_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" \
            -P "$IOS_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          # The identity listing proves that the P12 contains a usable signing identity for this team.
          SIGNING_IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$SIGNING_IDENTITIES"
          if ! grep -q "$SIGNING_TEAM_ID" <<< "$SIGNING_IDENTITIES"; then
            echo "::error::The imported P12 does not contain a signing identity for team $SIGNING_TEAM_ID."
            exit 1
          fi

          openssl smime \
            -inform der \
            -verify \
            -noverify \
            -in "$PROFILE_PATH" \
            -out "$PROFILE_PLIST_PATH"

          # These values are read from the profile so CI fails before compilation on signing mismatches.
          PROFILE_UUID="$(plutil -extract UUID raw -o - "$PROFILE_PLIST_PATH")"
          ACTUAL_PROFILE_NAME="$(plutil -extract Name raw -o - "$PROFILE_PLIST_PATH")"
          ACTUAL_TEAM_ID="$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST_PATH")"
          ACTUAL_APP_IDENTIFIER="$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST_PATH")"
          PROFILE_EXPIRATION="$(plutil -extract ExpirationDate raw -o - "$PROFILE_PLIST_PATH")"
          # ISO-8601 UTC strings sort chronologically, which avoids locale-dependent date parsing.
          CURRENT_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [[ "$ACTUAL_PROFILE_NAME" != "$PROFILE_NAME" ]]; then
            echo "::error::Expected provisioning profile $PROFILE_NAME, found $ACTUAL_PROFILE_NAME."
            exit 1
          fi
          if [[ "$ACTUAL_TEAM_ID" != "$SIGNING_TEAM_ID" ]]; then
            echo "::error::Expected signing team $SIGNING_TEAM_ID, found $ACTUAL_TEAM_ID."
            exit 1
          fi
          if [[ "$ACTUAL_APP_IDENTIFIER" != "$SIGNING_TEAM_ID.$BUNDLE_ID" ]]; then
            echo "::error::Provisioning profile does not cover $BUNDLE_ID."
            exit 1
          fi
          if ! plutil -extract ProvisionedDevices.0 raw -o - "$PROFILE_PLIST_PATH" >/dev/null 2>&1; then
            echo "::error::The supplied profile is not an Ad Hoc profile with registered devices."
            exit 1
          fi
          if [[ "$PROFILE_EXPIRATION" < "$CURRENT_UTC" ]]; then
            echo "::error::Provisioning profile expired at $PROFILE_EXPIRATION."
            exit 1
          fi

          # Xcode discovers manually managed profiles only from this per-user directory.
          PROFILE_INSTALL_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_INSTALL_PATH="$PROFILE_INSTALL_DIRECTORY/$PROFILE_UUID.mobileprovision"
          mkdir -p "$PROFILE_INSTALL_DIRECTORY"
          cp "$PROFILE_PATH" "$PROFILE_INSTALL_PATH"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Prepare Flutter iOS configuration
        run: |
          flutter build ios \
            --release \
            --config-only \
            --no-codesign \
            --build-name "$VERSION_NUMBER" \
            --build-number "$BUILD_NUMBER"

      - name: Archive signed application
        run: |
          # The archive is temporary because only the exported IPA is retained as an artifact.
          ARCHIVE_PATH="$RUNNER_TEMP/Runner.xcarchive"

          # Release.xcconfig 只为 Runner 映射描述文件，避免 Swift Package targets 继承签名设置。
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$SIGNING_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            RUNNER_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db" \
            archive

      - name: Export Ad Hoc IPA
        run: |
          # Xcode 26 names the former ad-hoc export method release-testing.
          ARCHIVE_PATH="$RUNNER_TEMP/Runner.xcarchive"
          EXPORT_PATH="$GITHUB_WORKSPACE/app/build/ios/ipa"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"

          plutil -create xml1 "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :method string release-testing" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :teamID string $SIGNING_TEAM_ID" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$EXPORT_OPTIONS_PATH"

          mkdir -p "$EXPORT_PATH"
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH"

          ls -la "$EXPORT_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker-ios-${{ inputs.version_number }}-${{ inputs.build_number }}
          path: ${{ github.workspace }}/app/build/ios/ipa/*.ipa
          if-no-files-found: error
          # IPA 仅保留短期下载窗口，避免连续打包耗尽共享的 Actions Artifact 配额。
          retention-days: 3

      - name: Remove temporary signing assets
        if: always()
        run: |
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/ios-distribution.p12" \
            "$RUNNER_TEMP/ios-ad-hoc.mobileprovision" \
            "$RUNNER_TEMP/ios-ad-hoc.plist" \
            "$RUNNER_TEMP/ExportOptions.plist"
