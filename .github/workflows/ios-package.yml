name: Package ios-client

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: App version in major.minor.patch format, for example 2.1.0
        required: true
        default: "2.1.0"
        type: string
      build_number:
        description: Positive integer App Store build number
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: ios-client-app-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-ios-client:
    name: Build CandyTalk App Store IPA
    runs-on: macos-26-intel
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: ios-client
    env:
      # Pins the Xcode release used to archive and export the CandyTalk application.
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
      # Matches the Flutter toolchain used to regenerate the Add-to-App iOS integration.
      FLUTTER_VERSION: "3.44.4"
      # Matches the CocoaPods version used by the current iOS workspace.
      COCOAPODS_VERSION: "1.16.2"
      # Identifies the CocoaPods workspace that contains the CandyTalk application.
      WORKSPACE: CIMSDK.xcworkspace
      # Identifies the shared application scheme enabled for Release archives.
      SCHEME: CandyTalk
      # Keeps workflow inputs out of shell source so their values cannot become commands.
      VERSION_NUMBER: ${{ inputs.version_number }}
      # Supplies the unique CFBundleVersion required for App Store uploads.
      BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate package metadata
        run: |
          set -euo pipefail

          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_number must use major.minor.patch format."
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::build_number must be a positive integer."
            exit 1
          fi

      - name: Resolve Flutter module dependencies
        working-directory: ios-client/work_module
        run: |
          set -euo pipefail
          flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail

          if ! gem list --installed cocoapods --version "$COCOAPODS_VERSION" >/dev/null; then
            gem install cocoapods --version "$COCOAPODS_VERSION" --no-document
          fi

          pod "_${COCOAPODS_VERSION}_" install --repo-update

      - name: Import App Store signing assets
        env:
          # Base64-encoded Apple Distribution P12 stored only in GitHub Secrets.
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          # Password for the Apple Distribution P12 stored only in GitHub Secrets.
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          # Base64-encoded App Store provisioning profile stored only in GitHub Secrets.
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || -z "$PROVISIONING_PROFILE_BASE64" ]]; then
            echo "::error::IOS_DISTRIBUTION_CERTIFICATE_BASE64, IOS_DISTRIBUTION_CERTIFICATE_PASSWORD, and IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 are required."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_SOURCE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_SOURCE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk 'NR == 1 { print $2 }')"
          if [[ ! "$SIGNING_IDENTITY" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::No valid code-signing identity was found in the P12 certificate."
            exit 1
          fi

          security cms -D -i "$PROFILE_SOURCE_PATH" > "$PROFILE_PLIST_PATH"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST_PATH")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST_PATH")"
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST_PATH")"
          APP_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST_PATH")"
          PROFILE_EXPIRATION="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PROFILE_PLIST_PATH")"
          BUNDLE_ID="${APP_IDENTIFIER#*.}"

          if [[ -z "$PROFILE_UUID" || -z "$PROFILE_NAME" || -z "$TEAM_ID" || -z "$BUNDLE_ID" ]]; then
            echo "::error::The provisioning profile is missing required signing information."
            exit 1
          fi

          if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PROFILE_PLIST_PATH" >/dev/null 2>&1; then
            echo "::error::The provisioning profile contains registered devices and is not an App Store profile."
            exit 1
          fi

          PROVISIONS_ALL_DEVICES="$(/usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$PROFILE_PLIST_PATH" 2>/dev/null || true)"
          if [[ "$PROVISIONS_ALL_DEVICES" == "true" ]]; then
            echo "::error::An Enterprise provisioning profile cannot be used for App Store distribution."
            exit 1
          fi

          if [[ "$(date -j -f '%a %b %d %T %Z %Y' "$PROFILE_EXPIRATION" '+%s')" -le "$(date -u '+%s')" ]]; then
            echo "::error::The App Store provisioning profile has expired."
            exit 1
          fi

          INSTALLED_PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          mkdir -p "$(dirname "$INSTALLED_PROFILE_PATH")"
          cp "$PROFILE_SOURCE_PATH" "$INSTALLED_PROFILE_PATH"

          printf 'SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          printf 'PROFILE_NAME=%s\n' "$PROFILE_NAME" >> "$GITHUB_ENV"
          printf 'TEAM_ID=%s\n' "$TEAM_ID" >> "$GITHUB_ENV"
          printf 'BUNDLE_ID=%s\n' "$BUNDLE_ID" >> "$GITHUB_ENV"
          printf 'INSTALLED_PROFILE_PATH=%s\n' "$INSTALLED_PROFILE_PATH" >> "$GITHUB_ENV"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Archive CandyTalk application
        run: |
          set -euo pipefail

          # Stores the archive outside the checked-out repository for this runner.
          ARCHIVE_PATH="$RUNNER_TEMP/CandyTalk.xcarchive"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db" \
            MARKETING_VERSION="$VERSION_NUMBER" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          ARCHIVE_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$ARCHIVE_PATH/Info.plist")"
          if [[ "$ARCHIVE_BUNDLE_ID" != "$BUNDLE_ID" ]]; then
            echo "::error::Archive bundle ID $ARCHIVE_BUNDLE_ID does not match provisioning profile bundle ID $BUNDLE_ID."
            exit 1
          fi

      - name: Export App Store IPA
        run: |
          set -euo pipefail

          # Reuses the archive produced by the preceding step on the same runner.
          ARCHIVE_PATH="$RUNNER_TEMP/CandyTalk.xcarchive"
          # Stores the exported IPA outside the checked-out repository.
          EXPORT_PATH="$RUNNER_TEMP/CandyTalk-export"
          EXPORT_OPTIONS_PATH="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :signingCertificate string $SIGNING_IDENTITY" "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS_PATH"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$BUNDLE_ID string $PROFILE_NAME" "$EXPORT_OPTIONS_PATH"

          mkdir -p "$EXPORT_PATH"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH"

      - name: Upload CandyTalk IPA
        uses: actions/upload-artifact@v4
        with:
          name: CandyTalk-AppStore-${{ inputs.version_number }}-${{ inputs.build_number }}
          path: ${{ runner.temp }}/CandyTalk-export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing assets
        if: always()
        run: |
          if [[ -n "${INSTALLED_PROFILE_PATH:-}" ]]; then
            rm -f "$INSTALLED_PROFILE_PATH"
          fi

          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/profile.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist"
